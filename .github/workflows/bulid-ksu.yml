name: Build KSU fork kernel modules (6.6 android15)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel source git clone URL (6.6-android15, layout-compatible)'
        required: true
        type: string
        default: 'https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm8750/'
      kernel_ref:
        description: 'Kernel branch / tag / commit (e.g. android15-6.6)'
        required: true
        type: string
        default: 'android15-6.6'
      defconfig:
        description: 'defconfig name relative to arch/arm64/configs (e.g. vendor/xxx_defconfig; empty = auto-pick)'
        required: false
        type: string
        default: ''
      clang_version:
        description: 'Android prebuilt clang dir (e.g. clang-r547379); empty = apt clang'
        required: false
        type: string
        default: 'clang-r547379'
      next_repo:
        description: 'KernelSU-Next source repo'
        required: false
        type: string
        default: 'https://github.com/rifsxd/KernelSU-Next.git'
      next_ref:
        description: 'KernelSU-Next branch (empty = repo default)'
        required: false
        type: string
        default: ''
      bakasu_repo:
        description: 'BakaSU source repo (empty = skip)'
        required: false
        type: string
        default: 'https://github.com/backslashxx/bakasu.git'
      bakasu_ref:
        description: 'BakaSU branch (empty = repo default)'
        required: false
        type: string
        default: ''
      sukisu_repo:
        description: 'SukiSU source repo (empty = skip)'
        required: false
        type: string
        default: 'https://github.com/sukisu/KernelSU.git'
      sukisu_ref:
        description: 'SukiSU branch (empty = repo default)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl xz-utils bison flex bc cpio \
            libssl-dev libelf-dev python3 make gcc g++ pkg-config
          sudo apt-get install -y clang lld llvm || true

      - name: Set up Android prebuilt clang
        if: inputs.clang_version != ''
        run: |
          mkdir -p /opt/clang
          curl -L --fail \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/${{ inputs.clang_version }}.tar.gz" \
            -o /tmp/clang.tar.gz || { echo 'CLANG_DOWNLOAD_FAILED (check clang_version input or leave empty for apt clang)'; exit 1; }
          tar -xzf /tmp/clang.tar.gz -C /opt/clang
          ls /opt/clang | head

      - name: Checkout kernel source
        run: |
          git clone --depth 1 --branch "${{ inputs.kernel_ref }}" \
            "${{ inputs.kernel_repo }}" kernel 2>/dev/null || \
          git clone --depth 1 "${{ inputs.kernel_repo }}" kernel
          cd kernel
          git log -1 --format='KERNEL HEAD: %H %s'
          head -5 Makefile | grep -E 'VERSION|PATCHLEVEL|SUBLEVEL' || true

      - name: Configure kernel tree (modules_prepare)
        run: |
          echo "--- toolchain ---"
          if [ -d /opt/clang/bin ]; then
            /opt/clang/bin/clang --version | head -1
          else
            clang --version | head -1 || true
            gcc --version | head -1 || true
          fi
          echo "--- kernel version ---"
          cd kernel
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' Makefile | tr -d '\n'; echo
          CFG="${{ inputs.defconfig }}"
          if [ -z "$CFG" ]; then
            for d in arch/arm64/configs/vendor arch/arm64/configs; do
              [ -d "$d" ] || continue
              CFG=$(find "$d" -maxdepth 2 -name '*defconfig' 2>/dev/null | sort | head -1 | xargs -n1 basename 2>/dev/null)
              [ -n "$CFG" ] && break
            done
          fi
          if [ -z "$CFG" ]; then
            echo 'ERROR: no defconfig found (set the defconfig input manually)'
            ls arch/arm64/configs 2>&1 | head -20
            exit 1
          fi
          echo "USING_CFG=$CFG"
          make ARCH=arm64 LLVM=1 "$CFG" || { echo 'MAKE_DEFCONFIG_FAILED'; exit 1; }
          # Runtime loading is handled by the custom loader (vermagic rewrite +
          # syms.txt symbol resolution), so modversions is disabled to match the
          # known-good modules (their __versions section is empty).
          scripts/config --disable CONFIG_MODVERSIONS
          scripts/config --enable CONFIG_MODULES
          scripts/config --enable CONFIG_KALLSYMS
          scripts/config --enable CONFIG_KPROBES
          scripts/config --enable CONFIG_MODULE_UNLOAD
          scripts/config --enable CONFIG_SECURITY_SELINUX
          make ARCH=arm64 LLVM=1 olddefconfig || { echo 'OLDEFCONFIG_FAILED'; exit 1; }
          echo "--- config sanity ---"
          grep -E 'CONFIG_MODULES=|CONFIG_MODVERSIONS|CONFIG_KPROBES=|CONFIG_MODULE_UNLOAD|CONFIG_SECURITY_SELINUX=' .config || true
          make ARCH=arm64 LLVM=1 modules_prepare 2>&1 | tail -25 || { echo 'MODULES_PREPARE_FAILED (see tail above)'; exit 1; }
          # KSU-Next / fork modules include selinux objects that need the
          # kernel's generated SELinux headers (flask.h etc.), which
          # modules_prepare does NOT produce. flask.h is an independent rule
          # (genheaders), so it must be requested as an explicit target.
          make ARCH=arm64 LLVM=1 security/selinux/ 2>&1 | tail -8 || echo 'SELINUX_DIR_WARN'
          make ARCH=arm64 LLVM=1 security/selinux/flask.h security/selinux/av_permissions.h 2>&1 | tail -12 || echo 'SELINUX_FLASK_GEN_FAILED'
          echo "--- flask.h check ---"
          ls -l security/selinux/flask.h security/selinux/include/flask.h 2>/dev/null || true
          find . -maxdepth 5 -name 'flask.h' | head -3
          echo "MODULES_PREPARE_OK"

      - name: Build KernelSU-Next module
        if: inputs.next_repo != ''
        run: |
          git clone --depth 1 --branch "${{ inputs.next_ref }}" "${{ inputs.next_repo }}" next 2>/dev/null || \
          git clone --depth 1 "${{ inputs.next_repo }}" next
          git -C next log -1 --format='NEXT HEAD: %H %s'
          ls next/kernel/Kbuild || { echo 'ERROR: next/kernel/Kbuild not found'; find next -maxdepth 2 -name Kbuild -o -name Makefile | head; exit 1; }
          patch_fork() {
            F="$PWD/$1/kernel/hook/setuid_hook.c"
            [ -f "$F" ] || { echo "no setuid_hook.c for $1"; return 0; }
            # Vendor kernels (e.g. OPPO) customize struct seccomp and drop the
            # mode/filter members GKI code expects. The allow-cache is only an
            # optimization, so drop those calls to stay compatible.
            sed -i '/ksu_seccomp_allow_cache(current->seccomp.filter, __NR_reboot);/d' "$F"
            perl -0pi -e 's/\s*if \(current->seccomp\.mode == SECCOMP_MODE_FILTER &&\s*\n\s*current->seccomp\.filter\) \{\n(.*?)\n\s*\}//s' "$F"
            sed -i '0,/#include <linux\/compiler.h>/s//#include <linux\/compiler.h>\n#include <asm\/unistd.h>/' "$F"
            # register_trace_prio_* is a 6.12+ tracepoint API; vendor 6.6 trees
            # only have the plain register_trace_sys_enter variant.
            F2="$PWD/$1/kernel/hook/syscall_hook_manager.c"
            [ -f "$F2" ] && sed -i 's/register_trace_prio_sys_enter(ksu_sys_enter_handler, NULL, INT_MIN)/register_trace_sys_enter(ksu_sys_enter_handler, NULL)/' "$F2"
            echo "patched $1 setuid_hook.c / syscall_hook_manager.c"
          }
          patch_fork next
          MDIR="$PWD/next/kernel"
          KDIR="$PWD/kernel"
          make -C "$KDIR" ARCH=arm64 LLVM=1 M="$MDIR" src="$MDIR" modules \
            CONFIG_KSU=m KBUILD_MODPOST_WARN=1 2>&1 | tee next-build.log | tail -25 || { echo 'NEXT_BUILD_FAILED (errors below)'; grep -n 'error:' next-build.log | head -30; exit 1; }
          ls -l "$MDIR/kernelsu.ko" 2>/dev/null || { echo 'NO kernelsu.ko produced'; find "$MDIR" -maxdepth 1 -name '*.ko' -o -name '*.o' | head; exit 1; }
          cp "$MDIR/kernelsu.ko" ksu-base-next.ko
          echo "built next -> ksu-base-next.ko"

      - name: Build BakaSU module
        if: inputs.bakasu_repo != ''
        run: |
          git clone --depth 1 --branch "${{ inputs.bakasu_ref }}" "${{ inputs.bakasu_repo }}" bakasu 2>/dev/null || \
          git clone --depth 1 "${{ inputs.bakasu_repo }}" bakasu
          git -C bakasu log -1 --format='BAKASU HEAD: %H %s'
          M_DIR=$(find bakasu -maxdepth 2 -type d -name kernel | head -1)
          [ -n "$M_DIR" ] || { echo 'ERROR: bakasu kernel dir not found'; find bakasu -maxdepth 2 -name Kbuild -o -name Makefile | head; exit 1; }
          patch_fork() {
            F="$PWD/$1/kernel/hook/setuid_hook.c"
            [ -f "$F" ] || { echo "no setuid_hook.c for $1"; return 0; }
            sed -i '/ksu_seccomp_allow_cache(current->seccomp.filter, __NR_reboot);/d' "$F"
            perl -0pi -e 's/\s*if \(current->seccomp\.mode == SECCOMP_MODE_FILTER &&\s*\n\s*current->seccomp\.filter\) \{\n(.*?)\n\s*\}//s' "$F"
            sed -i '0,/#include <linux\/compiler.h>/s//#include <linux\/compiler.h>\n#include <asm\/unistd.h>/' "$F"
            F2="$PWD/$1/kernel/hook/syscall_hook_manager.c"
            [ -f "$F2" ] && sed -i 's/register_trace_prio_sys_enter(ksu_sys_enter_handler, NULL, INT_MIN)/register_trace_sys_enter(ksu_sys_enter_handler, NULL)/' "$F2"
            echo "patched $1 setuid_hook.c / syscall_hook_manager.c"
          }
          patch_fork bakasu
          MDIR="$PWD/$M_DIR"
          KDIR="$PWD/kernel"
          make -C "$KDIR" ARCH=arm64 LLVM=1 M="$MDIR" src="$MDIR" modules \
            CONFIG_KSU=m KBUILD_MODPOST_WARN=1 2>&1 | tee bakasu-build.log | tail -25 || { echo 'BAKASU_BUILD_FAILED (errors below)'; grep -n 'error:' bakasu-build.log | head -30; exit 1; }
          ls -l "$MDIR/kernelsu.ko" 2>/dev/null || { echo 'NO kernelsu.ko produced'; find "$MDIR" -maxdepth 1 -name '*.ko' -o -name '*.o' | head; exit 1; }
          cp "$MDIR/kernelsu.ko" ksu-base-bakasu.ko
          echo "built bakasu -> ksu-base-bakasu.ko"

      - name: Build SukiSU module
        if: inputs.sukisu_repo != ''
        run: |
          git clone --depth 1 --branch "${{ inputs.sukisu_ref }}" "${{ inputs.sukisu_repo }}" sukisu 2>/dev/null || \
          git clone --depth 1 "${{ inputs.sukisu_repo }}" sukisu
          git -C sukisu log -1 --format='SUKISU HEAD: %H %s'
          M_DIR=$(find sukisu -maxdepth 2 -type d -name kernel | head -1)
          [ -n "$M_DIR" ] || { echo 'ERROR: sukisu kernel dir not found'; find sukisu -maxdepth 2 -name Kbuild -o -name Makefile | head; exit 1; }
          patch_fork() {
            F="$PWD/$1/kernel/hook/setuid_hook.c"
            [ -f "$F" ] || { echo "no setuid_hook.c for $1"; return 0; }
            sed -i '/ksu_seccomp_allow_cache(current->seccomp.filter, __NR_reboot);/d' "$F"
            perl -0pi -e 's/\s*if \(current->seccomp\.mode == SECCOMP_MODE_FILTER &&\s*\n\s*current->seccomp\.filter\) \{\n(.*?)\n\s*\}//s' "$F"
            sed -i '0,/#include <linux\/compiler.h>/s//#include <linux\/compiler.h>\n#include <asm\/unistd.h>/' "$F"
            F2="$PWD/$1/kernel/hook/syscall_hook_manager.c"
            [ -f "$F2" ] && sed -i 's/register_trace_prio_sys_enter(ksu_sys_enter_handler, NULL, INT_MIN)/register_trace_sys_enter(ksu_sys_enter_handler, NULL)/' "$F2"
            echo "patched $1 setuid_hook.c / syscall_hook_manager.c"
          }
          patch_fork sukisu
          MDIR="$PWD/$M_DIR"
          KDIR="$PWD/kernel"
          make -C "$KDIR" ARCH=arm64 LLVM=1 M="$MDIR" src="$MDIR" modules \
            CONFIG_KSU=m KBUILD_MODPOST_WARN=1 2>&1 | tee sukisu-build.log | tail -25 || { echo 'SUKISU_BUILD_FAILED (errors below)'; grep -n 'error:' sukisu-build.log | head -30; exit 1; }
          ls -l "$MDIR/kernelsu.ko" 2>/dev/null || { echo 'NO kernelsu.ko produced'; find "$MDIR" -maxdepth 1 -name '*.ko' -o -name '*.o' | head; exit 1; }
          cp "$MDIR/kernelsu.ko" ksu-base-sukisu.ko
          echo "built sukisu -> ksu-base-sukisu.ko"

      - name: Inspect built modules
        run: |
          {
            echo "=== build report ==="
            echo "kernel: ${{ inputs.kernel_repo }} @ ${{ inputs.kernel_ref }}"
            cd kernel && git log -1 --format='head %H %s' && cd ..
            for f in ksu-base-*.ko; do
              [ -f "$f" ] || continue
              echo "== $f =="
              modinfo "$f" | grep -E '^vermagic|^name|^license|^parmtype' || true
              echo "undefined symbols: $(nm -u "$f" 2>/dev/null | wc -l)"
              sha256sum "$f"
            done
          } | tee build-report.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ksu-fork-modules
          path: |
            ksu-base-*.ko
            build-report.txt
          retention-days: 30
