name: Build KSU fork kernel modules (6.6 android15)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel source git clone URL (6.6-android15, layout-compatible)'
        required: true
        type: string
        default: 'https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm8750'
      kernel_ref:
        description: 'Kernel branch / tag / commit (e.g. android15-6.6)'
        required: true
        type: string
        default: 'android15-6.6'
      defconfig:
        description: 'defconfig name relative to arch/arm64/configs (e.g. vendor/xxx_defconfig; empty = auto-pick)'
        required: false
        type: string
        default: ''
      clang_version:
        description: 'Android prebuilt clang dir (e.g. clang-r547379); empty = apt clang'
        required: false
        type: string
        default: 'clang-r547379'
      next_repo:
        description: 'KernelSU-Next source repo'
        required: false
        type: string
        default: 'https://github.com/rifsxd/KernelSU-Next.git'
      next_ref:
        description: 'KernelSU-Next branch'
        required: false
        type: string
        default: 'main'
      bakasu_repo:
        description: 'BakaSU source repo (empty = skip)'
        required: false
        type: string
        default: 'https://github.com/backslashxx/bakasu.git'
      bakasu_ref:
        description: 'BakaSU branch'
        required: false
        type: string
        default: 'main'
      sukisu_repo:
        description: 'SukiSU source repo (empty = skip)'
        required: false
        type: string
        default: 'https://github.com/sukisu/KernelSU.git'
      sukisu_ref:
        description: 'SukiSU branch'
        required: false
        type: string
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl xz-utils bison flex bc cpio \
            libssl-dev libelf-dev python3 make gcc g++ pkg-config
          sudo apt-get install -y clang lld llvm || true

      - name: Set up Android prebuilt clang
        if: inputs.clang_version != ''
        run: |
          mkdir -p /opt/clang
          curl -L --fail \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/${{ inputs.clang_version }}.tar.gz" \
            -o /tmp/clang.tar.gz || { echo 'CLANG_DOWNLOAD_FAILED (check clang_version input or leave empty for apt clang)'; exit 1; }
          tar -xzf /tmp/clang.tar.gz -C /opt/clang
          ls /opt/clang | head

      - name: Checkout kernel source
        run: |
          git clone --depth 1 --branch "${{ inputs.kernel_ref }}" \
            "${{ inputs.kernel_repo }}" kernel 2>/dev/null || \
          git clone --depth 1 "${{ inputs.kernel_repo }}" kernel
          cd kernel
          git log -1 --format='KERNEL HEAD: %H %s'
          head -5 Makefile | grep -E 'VERSION|PATCHLEVEL|SUBLEVEL' || true

      - name: Configure kernel tree (modules_prepare)
        run: |
          echo "--- toolchain ---"
          if [ -d /opt/clang/bin ]; then
            /opt/clang/bin/clang --version | head -1
          else
            clang --version | head -1 || true
            gcc --version | head -1 || true
          fi
          echo "--- kernel version ---"
          cd kernel
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' Makefile | tr -d '\n'; echo
          CFG="${{ inputs.defconfig }}"
          if [ -z "$CFG" ]; then
            for d in arch/arm64/configs/vendor arch/arm64/configs; do
              [ -d "$d" ] || continue
              CFG=$(find "$d" -maxdepth 2 -name '*defconfig' 2>/dev/null | sort | head -1 | xargs -n1 basename 2>/dev/null)
              [ -n "$CFG" ] && break
            done
          fi
          if [ -z "$CFG" ]; then
            echo 'ERROR: no defconfig found (set the defconfig input manually)'
            ls arch/arm64/configs 2>&1 | head -20
            exit 1
          fi
          echo "USING_CFG=$CFG"
          make ARCH=arm64 LLVM=1 "$CFG" || { echo 'MAKE_DEFCONFIG_FAILED'; exit 1; }
          # Runtime loading is handled by the custom loader (vermagic rewrite +
          # syms.txt symbol resolution), so modversions is disabled to match the
          # known-good modules (their __versions section is empty).
          scripts/config --disable CONFIG_MODVERSIONS
          scripts/config --enable CONFIG_MODULES
          scripts/config --enable CONFIG_KALLSYMS
          scripts/config --enable CONFIG_KPROBES
          scripts/config --enable CONFIG_MODULE_UNLOAD
          make ARCH=arm64 LLVM=1 olddefconfig || { echo 'OLDEFCONFIG_FAILED'; exit 1; }
          echo "--- config sanity ---"
          grep -E 'CONFIG_MODULES=|CONFIG_MODVERSIONS|CONFIG_KPROBES=|CONFIG_MODULE_UNLOAD' .config || true
          make ARCH=arm64 LLVM=1 modules_prepare 2>&1 | tail -25 || { echo 'MODULES_PREPARE_FAILED (see tail above)'; exit 1; }
          echo "MODULES_PREPARE_OK"

      - name: Build KernelSU-Next module
        if: inputs.next_repo != ''
        run: |
          git clone --depth 1 --branch "${{ inputs.next_ref }}" "${{ inputs.next_repo }}" next
          ls next/kernel/Makefile || { echo 'ERROR: next/kernel/Makefile not found'; exit 1; }
          make ARCH=arm64 LLVM=1 KBUILD_MODPOST_WARN=1 -C "$PWD/kernel" \
            M="$PWD/next/kernel" modules 2>&1 | tail -8
          cp next/kernel/kernelsu.ko ksu-base-next.ko
          echo "built next -> ksu-base-next.ko"

      - name: Build BakaSU module
        if: inputs.bakasu_repo != ''
        run: |
          git clone --depth 1 --branch "${{ inputs.bakasu_ref }}" "${{ inputs.bakasu_repo }}" bakasu
          find bakasu -maxdepth 2 -name Makefile -path '*kernel*' | head -3
          M_DIR=$(find bakasu -maxdepth 2 -type d -name kernel | head -1)
          [ -n "$M_DIR" ] || { echo 'ERROR: bakasu kernel dir not found'; exit 1; }
          make ARCH=arm64 LLVM=1 KBUILD_MODPOST_WARN=1 -C "$PWD/kernel" \
            M="$PWD/$M_DIR" modules 2>&1 | tail -8
          cp "$M_DIR"/kernelsu.ko ksu-base-bakasu.ko
          echo "built bakasu -> ksu-base-bakasu.ko"

      - name: Build SukiSU module
        if: inputs.sukisu_repo != ''
        run: |
          git clone --depth 1 --branch "${{ inputs.sukisu_ref }}" "${{ inputs.sukisu_repo }}" sukisu
          M_DIR=$(find sukisu -maxdepth 2 -type d -name kernel | head -1)
          [ -n "$M_DIR" ] || { echo 'ERROR: sukisu kernel dir not found'; exit 1; }
          make ARCH=arm64 LLVM=1 KBUILD_MODPOST_WARN=1 -C "$PWD/kernel" \
            M="$PWD/$M_DIR" modules 2>&1 | tail -8
          cp "$M_DIR"/kernelsu.ko ksu-base-sukisu.ko
          echo "built sukisu -> ksu-base-sukisu.ko"

      - name: Inspect built modules
        run: |
          {
            echo "=== build report ==="
            echo "kernel: ${{ inputs.kernel_repo }} @ ${{ inputs.kernel_ref }}"
            cd kernel && git log -1 --format='head %H %s' && cd ..
            for f in ksu-base-*.ko; do
              [ -f "$f" ] || continue
              echo "== $f =="
              modinfo "$f" | grep -E '^vermagic|^name|^license|^parmtype' || true
              echo "undefined symbols: $(nm -u "$f" 2>/dev/null | wc -l)"
              sha256sum "$f"
            done
          } | tee build-report.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ksu-fork-modules
          path: |
            ksu-base-*.ko
            build-report.txt
          retention-days: 30
